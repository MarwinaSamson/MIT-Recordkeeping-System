{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Educational Background - Graduate School Admission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#8c1515",
              "brand-dark": "#5e0d0d",
              "brand-light": "#a31a1a",
              beige: "#faf8f5",
              ink: "#1c1010",
              muted: "#7a6060",
              border: "#e8d8c8",
            },
            fontFamily: {
              display: ['"Playfair Display"', "serif"],
              body: ['"DM Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body { font-family: "DM Sans", sans-serif; }
      h1, h2, h3 { font-family: "Playfair Display", serif; }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #8c1515 !important;
        box-shadow: 0 0 0 3px rgba(140,21,21,0.08);
      }
    </style>
  </head>

  <body class="bg-beige min-h-screen">
    <header class="text-center pt-6 sm:pt-10 pb-4 sm:pb-6">
      <div class="flex items-center justify-center mb-3 sm:mb-4">
        <img src="{% static 'assets/logoandcap.png' %}" alt="WMSU Logo"
          class="h-12 sm:h-16 w-auto object-contain drop-shadow-sm" />
      </div>
      <div class="flex items-center justify-center gap-3 mb-2">
        <span class="block w-8 h-px bg-[#8c1515]/30"></span>
        <p class="text-[0.62rem] font-semibold tracking-[0.18em] uppercase text-[#8c1515]">Enrollment Portal</p>
        <span class="block w-8 h-px bg-[#8c1515]/30"></span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-ink">
        WMSU <em class="italic text-brand">Graduate School</em>
      </h1>
      <p class="text-xs sm:text-sm text-muted mt-1 px-4">Admission Form &mdash; Complete all sections to submit your application.</p>
    </header>
    <div class="max-w-4xl mx-auto px-4 mb-6 sm:mb-8">
      <div class="flex items-center justify-between" id="progressBar"></div>
    </div>
    <div class="max-w-3xl mx-auto px-4 pb-12">
      <div class="bg-white rounded-2xl shadow-xl p-6 md:p-10">
        <h2 class="text-2xl font-bold text-brand mb-6">
          Educational Background
        </h2>
        <form id="eduForm" method="post" class="space-y-5" novalidate>
          {% csrf_token %}
          <!-- Sections generated by JS -->
          <div id="sections"></div>
          <div class="flex justify-between pt-4">
            <a
              href="{% url 'personalDetails' %}"
              class="inline-flex items-center gap-2 px-5 sm:px-8 py-3 rounded-lg border-2 border-brand text-brand font-semibold hover:bg-brand/5 active:scale-[0.98] transition"
              >← Back</a
            >
            <button
              type="submit"
              class="inline-flex items-center gap-2 px-5 sm:px-8 py-3 rounded-lg bg-brand text-white font-semibold hover:opacity-90 active:scale-[0.98] transition shadow-md"
            >
              Next →
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="{% static 'students_app/js/educationalBackground.js' %}"></script>
  </body>
</html>
