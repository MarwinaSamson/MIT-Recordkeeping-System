{% load static %}
<!-- ══ PAGE: STUDENT MESSAGING ══ -->
<div id="page-student-messaging" class="page p-8 w-full hidden">
    <div class="mb-7 fade-in">
        <h1 class="text-3xl font-bold text-gray-800" style="font-family: 'Playfair Display', serif">
            Student Messaging
        </h1>
        <p class="text-gray-400 text-sm mt-1">
            Send targeted messages to students based on their status
        </p>
    </div>

    <!-- Action Buttons Row -->
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 mb-6 fade-in">
        <button onclick="openActionModal('eligible_enrollment')"
            class="flex flex-col items-center gap-2 p-4 bg-green-50 hover:bg-green-100 border border-green-200 rounded-xl transition group">
            <i data-lucide="graduation-cap" class="w-6 h-6 text-green-600"></i>
            <span class="text-xs font-semibold text-green-700">Eligible for Enrollment</span>
        </button>

        <button onclick="openActionModal('ineligible_enrollment')"
            class="flex flex-col items-center gap-2 p-4 bg-red-50 hover:bg-red-100 border border-red-200 rounded-xl transition group">
            <i data-lucide="alert-triangle" class="w-6 h-6 text-red-600"></i>
            <span class="text-xs font-semibold text-red-700">Not Eligible</span>
        </button>

        <button onclick="openActionModal('missing_requirements')"
            class="flex flex-col items-center gap-2 p-4 bg-orange-50 hover:bg-orange-100 border border-orange-200 rounded-xl transition group">
            <i data-lucide="file-text" class="w-6 h-6 text-orange-600"></i>
            <span class="text-xs font-semibold text-orange-700">Missing Requirements</span>
        </button>

        <button onclick="openActionModal('cor_reminder')"
            class="flex flex-col items-center gap-2 p-4 bg-yellow-50 hover:bg-yellow-100 border border-yellow-200 rounded-xl transition group">
            <i data-lucide="receipt" class="w-6 h-6 text-yellow-700"></i>
            <span class="text-xs font-semibold text-yellow-700">COR Reminder</span>
        </button>

        <button onclick="openActionModal('grade_concern')"
            class="flex flex-col items-center gap-2 p-4 bg-purple-50 hover:bg-purple-100 border border-purple-200 rounded-xl transition group">
            <i data-lucide="trending-down" class="w-6 h-6 text-purple-600"></i>
            <span class="text-xs font-semibold text-purple-700">Grade Concerns</span>
        </button>

        <button onclick="openActionModal('deadline')"
            class="flex flex-col items-center gap-2 p-4 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl transition group">
            <i data-lucide="calendar-clock" class="w-6 h-6 text-blue-600"></i>
            <span class="text-xs font-semibold text-blue-700">Deadline Alert</span>
        </button>
    </div>

    <!-- Alternative: Quick Message Composer (collapsible) -->
    <div class="bg-white rounded-2xl shadow-sm mb-6 fade-in">
        <button onclick="toggleComposer()"
            class="w-full px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition rounded-2xl">
            <div class="flex items-center gap-3">
                <i data-lucide="edit-3" class="w-5 h-5 text-red-700"></i>
                <span class="font-semibold text-gray-800">Or compose custom message</span>
            </div>
            <i data-lucide="chevron-down" id="composerChevron" class="w-5 h-5 text-gray-400 transition-transform"></i>
        </button>
        <div id="customComposer" class="hidden p-6 pt-0 border-t border-gray-100">
            <div class="space-y-4 mt-4">
                <!-- Recipient selection -->
                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                        Send to
                    </label>
                    <select id="msgRecipientGroup" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                        <option value="all">All Students</option>
                        <option value="eligible">✅ Eligible for Enrollment</option>
                        <option value="ineligible">❌ Not Eligible for Enrollment</option>
                        <option value="pending">⏳ With Pending Requirements</option>
                        <option value="no_cor">📄 No COR Uploaded</option>
                        <option value="failing_grades">⚠️ With Failing Grades</option>
                        <option value="specific">🎯 Specific Student</option>
                    </select>
                </div>

                <div id="specificStudentDiv" class="hidden">
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                        Select Student
                    </label>
                    <select id="specificStudentSelect"
                        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                        <option value="">-- Select student --</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                        Subject
                    </label>
                    <input type="text" id="msgSubject"
                        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm"
                        placeholder="Message subject">
                </div>

                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                        Message Body
                    </label>
                    <textarea id="msgBody" rows="5"
                        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm resize-none"
                        placeholder="Write your message..."></textarea>
                </div>

                <div class="flex gap-3">
                    <button onclick="sendCustomMessage()"
                        class="px-6 py-2.5 bg-red-700 hover:bg-red-800 text-white rounded-xl font-semibold transition flex items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Send to Inbox
                    </button>
                    <button onclick="sendCustomNotification()"
                        class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold transition flex items-center gap-2">
                        <i data-lucide="bell" class="w-4 h-4"></i> Send as Notification
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        <div class="bg-white rounded-xl shadow-sm p-4 text-center">
            <p class="text-2xl font-bold text-gray-800" id="totalStudentCount">0</p>
            <p class="text-xs text-gray-500">Total Students</p>
        </div>
        <div class="bg-green-50 rounded-xl shadow-sm p-4 text-center">
            <p class="text-2xl font-bold text-green-600" id="eligibleCount">0</p>
            <p class="text-xs text-green-600">Eligible</p>
        </div>
        <div class="bg-red-50 rounded-xl shadow-sm p-4 text-center">
            <p class="text-2xl font-bold text-red-600" id="ineligibleCount">0</p>
            <p class="text-xs text-red-600">Not Eligible</p>
        </div>
        <div class="bg-orange-50 rounded-xl shadow-sm p-4 text-center">
            <p class="text-2xl font-bold text-orange-600" id="pendingReqCount">0</p>
            <p class="text-xs text-orange-600">Missing Reqs</p>
        </div>
        <div class="bg-yellow-50 rounded-xl shadow-sm p-4 text-center">
            <p class="text-2xl font-bold text-yellow-700" id="noCorCount">0</p>
            <p class="text-xs text-yellow-700">No COR</p>
        </div>
    </div>

    <!-- Recent Messages History -->
    <div class="bg-white rounded-2xl shadow-sm p-6 fade-in">
        <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i data-lucide="clock" class="w-5 h-5 text-red-700"></i>
            Recent Messages
        </h2>
        <div id="recentMessagesList" class="space-y-2 max-h-64 overflow-y-auto">
            <p class="text-gray-400 text-sm text-center py-4">No messages sent yet.</p>
        </div>
    </div>
</div>

<!-- ── ACTION MODAL (Reusable) ── -->
<div id="actionModal" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 hidden"
    onclick="if(event.target===this) closeActionModal()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between">
            <h2 id="modalTitle" class="text-lg font-bold text-gray-800">Send Message</h2>
            <button onclick="closeActionModal()"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400">×</button>
        </div>

        <div class="p-6 space-y-5">
            <!-- Dynamic content based on action type -->
            <div id="modalContent"></div>

            <!-- Recipient selection (always present) -->
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                    Send to
                </label>
                <select id="modalRecipientGroup" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                    <option value="eligible">✅ Students Eligible for Enrollment</option>
                    <option value="ineligible">❌ Students Not Eligible for Enrollment</option>
                    <option value="affected">📋 Affected Students Only</option>
                    <option value="no_cor">📄 No COR on File</option>
                    <option value="failing_grades">⚠️ With Failing Grades</option>
                    <option value="all">👥 All Students</option>
                    <option value="specific">🎯 Specific Student</option>
                </select>
            </div>

            <div id="modalSpecificDiv" class="hidden">
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                    Select Student
                </label>
                <select id="modalSpecificStudent" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                    <option value="">-- Select student --</option>
                </select>
            </div>

            <!-- Subject -->
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                    Subject
                </label>
                <input type="text" id="modalSubject"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" placeholder="Message subject">
            </div>

            <!-- Message Body -->
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">
                    Message Body
                </label>
                <textarea id="modalBody" rows="8"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm resize-none"
                    placeholder="Write your message..."></textarea>
            </div>

            <!-- Preview Section -->
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Preview</p>
                <div id="messagePreview" class="text-sm text-gray-600 whitespace-pre-wrap"></div>
            </div>
        </div>

        <div class="sticky bottom-0 bg-white border-t border-gray-100 px-6 py-4 flex gap-3">
            <button onclick="closeActionModal()"
                class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition">Cancel</button>
            <button onclick="sendActionMessage()"
                class="flex-1 px-4 py-2.5 bg-red-700 hover:bg-red-800 text-white rounded-xl font-semibold transition flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-4 h-4"></i> Send Message
            </button>
        </div>
    </div>
</div>

<style>
    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .animate-spin {
        animation: spin 1s linear infinite;
        display: inline-block;
    }
</style>

<script>
    // ── Student Messaging System with Action Buttons ──

    let studentListData = [];
    let messageHistory = JSON.parse(localStorage.getItem('adminMessageHistory') || '[]');
    let currentActionType = null;
    const MESSAGING_API = '/admin-panel/api/messaging';

    // ── Action Button Templates ──
    const ACTION_TEMPLATES = {
        eligible_enrollment: {
            title: '🎓 Eligible for Enrollment',
            subject: 'You are Eligible to Enroll for the Next Semester',
            fields: [
                { name: 'semester', label: 'Semester', type: 'select', options: ['1st Semester', '2nd Semester', 'Summer'], default: '1st Semester' },
                { name: 'academic_year', label: 'Academic Year', type: 'text', placeholder: 'e.g., 2026-2027', default: new Date().getFullYear() + '-' + (new Date().getFullYear() + 1) },
                { name: 'enrollment_start', label: 'Enrollment Start Date', type: 'date' },
                { name: 'enrollment_end', label: 'Enrollment Deadline', type: 'date' },
                { name: 'additional_instructions', label: 'Additional Instructions (optional)', type: 'textarea', placeholder: 'e.g., Bring your requirements to the registrar\'s office...' }
            ],
            generateBody: (data) => {
                const currentYear = new Date().getFullYear();
                return `Dear Student,

🎓 CONGRATULATIONS! You are eligible to enroll for the ${data.semester || '1st Semester'} of A.Y. ${data.academic_year || currentYear + '-' + (currentYear + 1)}.

Based on our records, you have successfully met all the requirements for enrollment:
✅ All required documents have been submitted and verified
✅ All grades meet the passing threshold (≤ 2.0)
✅ Certificate of Registration is on file
✅ Good academic standing maintained

📅 Enrollment Period: ${data.enrollment_start || '[Start Date]'} to ${data.enrollment_end || '[Deadline]'}

To proceed with your enrollment:
1. Log in to your student portal
2. Navigate to the Enrollment section
3. Complete the online enrollment form
4. Pay the required fees

${data.additional_instructions ? `📌 Additional Instructions:\n${data.additional_instructions}\n` : ''}

Please complete your enrollment before the deadline to secure your slot.

Best regards,
Office of the University Registrar
WMSU Graduate School`;
            }
        },

        ineligible_enrollment: {
            title: '⚠️ Not Eligible for Enrollment',
            subject: 'Notice of Incomplete Requirements for Enrollment',
            fields: [
                { name: 'missing_items', label: 'Missing Requirements', type: 'checklist', items: ['Transcript of Records (TOR)', 'PSA Birth Certificate', 'Certificate of Registration (COR)', 'Recommendation Letters', 'Valid Government ID', 'Medical Certificate'] },
                { name: 'grade_concern', label: 'Grade Concern (if applicable)', type: 'checkbox', text: 'Student has failing grades (above 2.0)' },
                { name: 'action_required', label: 'Action Required', type: 'select', options: ['Submit missing documents', 'Consult with program adviser', 'File an appeal', 'Request for grade reevaluation'], default: 'Submit missing documents' },
                { name: 'deadline', label: 'Compliance Deadline', type: 'date' }
            ],
            generateBody: (data) => {
                const checkedMissing = data.missing_items ? Object.keys(data.missing_items).filter(k => data.missing_items[k]).join(', ') : '';
                return `Dear Student,

After reviewing your records, we regret to inform you that you currently do not meet all the requirements for enrollment for the upcoming semester.

📋 Missing or incomplete items:
${checkedMissing || '• Please check your portal for specific missing requirements'}

${data.grade_concern ? '⚠️ Grade Concern: You have one or more grades above 2.00 (failing grade). Please consult with your program adviser.\n' : ''}

To resolve this and become eligible for enrollment, please:
1. ${data.action_required || 'Submit missing documents'}${data.action_required === 'Consult with program adviser' ? ' - Schedule an appointment at the Graduate School Office' : ''}
2. Upload any missing documents through your student portal
3. Ensure all grades are updated

⏰ Deadline for compliance: ${data.deadline || '[Insert Date]'}

Once all requirements are complete, you will automatically become eligible for enrollment. Failure to comply by the deadline may result in delayed enrollment or loss of slot.

Best regards,
Office of the University Registrar
WMSU Graduate School`;
            }
        },

        missing_requirements: {
            title: '📋 Missing Requirements Notice',
            subject: 'Action Required: Missing Admission Requirements',
            fields: [
                { name: 'specific_requirements', label: 'Select Missing Requirements', type: 'multichecklist', items: ['Official Transcript of Records (TOR)', 'PSA Birth Certificate', 'Certificate of Registration (COR)', '2x2 ID Photos', 'Recommendation Letters', 'Medical Certificate', 'Good Moral Character', 'Entrance Exam Result'] },
                { name: 'deadline_days', label: 'Submission Deadline', type: 'select', options: ['3 days', '5 days', '7 days', '14 days', '30 days'], default: '7 days' },
                { name: 'upload_instructions', label: 'Upload Instructions', type: 'textarea', placeholder: 'e.g., PDF format only, max 10MB per file...' }
            ],
            generateBody: (data) => {
                const selectedReqs = data.specific_requirements ? Object.keys(data.specific_requirements).filter(k => data.specific_requirements[k]).map(k => `• ${k}`).join('\n') : '• Please check your portal for complete list';
                return `Dear Student,

Our records indicate that you have one or more pending document requirements for your application.

⚠️ Missing/Incomplete Documents:
${selectedReqs}

📎 How to submit:
1. Log in to your student portal
2. Go to the Documents section
3. Click "Upload" next to each required document
4. Ensure files are clear and readable (PDF, JPG, or PNG format)

${data.upload_instructions ? `📌 Additional Instructions:\n${data.upload_instructions}\n` : ''}

⏰ Deadline: Please submit within ${data.deadline_days || '7 days'} from receipt of this notice.

If you have already submitted these documents, please allow 2-3 business days for verification. You may disregard this notice if your documents are already under review.

Best regards,
Office of Admissions
WMSU Graduate School`;
            }
        },

        cor_reminder: {
            title: '📑 Certificate of Registration (COR) Reminder',
            subject: 'Reminder: Upload Your Certificate of Registration',
            fields: [
                { name: 'semester', label: 'Semester', type: 'select', options: ['Current Semester', '1st Semester', '2nd Semester', 'Summer'], default: 'Current Semester' },
                { name: 'academic_year', label: 'Academic Year', type: 'text', placeholder: 'e.g., 2025-2026' },
                { name: 'consequences', label: 'Consequences of Non-Submission', type: 'checklist', items: ['Cannot proceed with enrollment', 'No student ID issuance', 'Delayed academic record processing', 'Unable to access grades'] }
            ],
            generateBody: (data) => {
                const consequences = data.consequences ? Object.keys(data.consequences).filter(k => data.consequences[k]).map(c => `⚠️ ${c}`).join('\n') : '⚠️ Failure to submit may delay your enrollment and academic record processing';
                return `Dear Student,

We noticed that your Certificate of Registration (COR) for ${data.semester || 'the current semester'} ${data.academic_year ? `(${data.academic_year})` : ''} has not yet been uploaded to your student portal.

📄 The COR is a critical document required for:
• Enrollment verification
• Student ID processing
• Academic record keeping
• Library access

${consequences}

📎 How to upload:
1. Obtain a clear scan/photo of your COR from the Registrar's Office
2. Log in to your student portal
3. Go to the "COR Upload" section
4. Upload the file (PDF, JPG, or PNG format, max 10MB)

Please upload your COR as soon as possible to avoid any disruption to your student records.

If you have already uploaded your COR, please disregard this notice.

Best regards,
Office of the University Registrar
WMSU Graduate School`;
            }
        },

        grade_concern: {
            title: '⚠️ Grade Concern Notice',
            subject: 'Academic Standing Notice - Grade Concerns',
            fields: [
                { name: 'failing_subjects', label: 'Subjects with Concerns', type: 'multichecklist', items: ['MIT 201 - Advanced OS', 'MIT 202 - System Design', 'MIT 203 - Database Systems', 'MIT 204 - Project Management', 'MIT 205 - Technical Research'] },
                { name: 'current_gwa', label: 'Current GWA', type: 'text', placeholder: 'e.g., 2.5' },
                { name: 'required_action', label: 'Required Action', type: 'select', options: ['Consult with Program Adviser', 'Submit appeal for grade reevaluation', 'Remedial classes required', 'Repeat the subject(s)'], default: 'Consult with Program Adviser' },
                { name: 'consultation_schedule', label: 'Consultation Schedule (optional)', type: 'text', placeholder: 'e.g., Monday-Friday, 9AM-4PM' }
            ],
            generateBody: (data) => {
                const subjects = data.failing_subjects ? Object.keys(data.failing_subjects).filter(k => data.failing_subjects[k]).map(s => `• ${s}`).join('\n') : '• Please check your portal for detailed grade report';
                return `Dear Student,

This notice serves to inform you about your current academic standing based on your grades for the recent semester.

📊 Grade Summary:
${data.current_gwa ? `Current GWA: ${data.current_gwa}` : 'Current GWA: [Check portal]'}

⚠️ Subjects requiring attention:
${subjects}

🎯 Required Action: ${data.required_action || 'Consult with Program Adviser'}

${data.consultation_schedule ? `📅 Consultation Schedule: ${data.consultation_schedule}\n` : ''}

Please note that:
- The passing grade threshold is 2.00 or below
- Grades above 2.00 are considered failing and may affect your eligibility for enrollment
- You may be placed on academic probation if your GWA falls below the passing standard

We encourage you to meet with your program adviser to discuss strategies for academic improvement.

Best regards,
Graduate School Academic Committee
WMSU Graduate School`;
            }
        },

        deadline: {
            title: '⏰ Deadline Alert',
            subject: 'Important Deadline Reminder',
            fields: [
                { name: 'deadline_type', label: 'Deadline Type', type: 'select', options: ['Enrollment Deadline', 'Document Submission', 'Payment Deadline', 'Examination Period', 'Thesis/Defense Submission'], default: 'Enrollment Deadline' },
                { name: 'deadline_date', label: 'Deadline Date', type: 'date' },
                { name: 'consequences', label: 'Consequences of Missing Deadline', type: 'textarea', placeholder: 'e.g., Late enrollment fees, loss of slot, delayed graduation...' },
                { name: 'reminder_frequency', label: 'Reminder Type', type: 'select', options: ['First Notice', 'Final Notice', 'Urgent Notice'], default: 'First Notice' }
            ],
            generateBody: (data) => {
                return `Dear Student,

${data.reminder_frequency === 'Final Notice' ? '⚠️ FINAL NOTICE ⚠️\n\n' : ''}This is a ${data.reminder_frequency?.toLowerCase() || 'reminder'} regarding the upcoming ${data.deadline_type || 'deadline'}.

📅 ${data.deadline_type || 'Deadline'}: ${data.deadline_date || '[Insert Date]'}

⚠️ Important: Failure to meet this deadline may result in:
${data.consequences || '• Delayed processing\n• Additional fees\n• Possible loss of slot'}

Please take immediate action to complete the necessary requirements before the deadline.

If you have already complied, please disregard this notice.

Best regards,
Office of the University Registrar
WMSU Graduate School`;
            }
        }
    };

    // ── Open Action Modal with Template ──
    let currentFormData = {};

    function openActionModal(actionType) {
        currentActionType = actionType;
        const template = ACTION_TEMPLATES[actionType];
        if (!template) return;

        currentFormData = {};

        // Set modal title
        document.getElementById('modalTitle').innerHTML = template.title;
        document.getElementById('modalSubject').value = template.subject;

        // Generate dynamic form fields
        const modalContent = document.getElementById('modalContent');
        modalContent.innerHTML = `
      <div class="space-y-4">
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-3">
          <p class="text-xs text-blue-700">This message will be sent to students who ${actionType === 'eligible_enrollment' ? 'are eligible for enrollment.' : actionType === 'ineligible_enrollment' ? 'are not eligible for enrollment.' : actionType === 'missing_requirements' ? 'have missing requirements.' : actionType === 'cor_reminder' ? 'have not uploaded their COR.' : actionType === 'grade_concern' ? 'have failing grades.' : 'need to meet a deadline.'}</p>
        </div>
        ${template.fields.map(field => {
            if (field.type === 'select') {
                return `
              <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">${field.label}</label>
                <select id="field_${field.name}" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" onchange="updateMessagePreview()">
                  ${field.options.map(opt => `<option value="${opt}" ${opt === field.default ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>
              </div>`;
            } else if (field.type === 'text') {
                return `
              <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">${field.label}</label>
                <input type="text" id="field_${field.name}" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" placeholder="${field.placeholder || ''}" value="${field.default || ''}" oninput="updateMessagePreview()">
              </div>`;
            } else if (field.type === 'date') {
                return `
              <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">${field.label}</label>
                <input type="date" id="field_${field.name}" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" onchange="updateMessagePreview()">
              </div>`;
            } else if (field.type === 'textarea') {
                return `
              <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5">${field.label}</label>
                <textarea id="field_${field.name}" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm resize-none" placeholder="${field.placeholder || ''}" oninput="updateMessagePreview()"></textarea>
              </div>`;
            } else if (field.type === 'checkbox') {
                return `
              <div>
                <label class="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" id="field_${field.name}" class="w-4 h-4 rounded accent-red-700" onchange="updateMessagePreview()">
                  <span class="text-sm text-gray-700">${field.text}</span>
                </label>
              </div>`;
            } else if (field.type === 'checklist') {
                return `
              <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-2">${field.label}</label>
                <div class="space-y-2">
                  ${field.items.map(item => `
                    <label class="flex items-center gap-3 cursor-pointer">
                      <input type="checkbox" id="field_${field.name}_${item.replace(/\s+/g, '_')}" data-group="${field.name}" data-value="${item}" class="w-4 h-4 rounded accent-red-700" onchange="updateMessagePreview()">
                      <span class="text-sm text-gray-700">${item}</span>
                    </label>
                  `).join('')}
                </div>
              </div>`;
            } else if (field.type === 'multichecklist') {
                return `
              <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-2">${field.label}</label>
                <div class="space-y-2 max-h-48 overflow-y-auto border border-gray-100 rounded-xl p-3">
                  ${field.items.map(item => `
                    <label class="flex items-center gap-3 cursor-pointer">
                      <input type="checkbox" id="field_${field.name}_${item.replace(/\s+/g, '_')}" data-group="${field.name}" data-value="${item}" class="w-4 h-4 rounded accent-red-700" onchange="updateMessagePreview()">
                      <span class="text-sm text-gray-700">${item}</span>
                    </label>
                  `).join('')}
                </div>
              </div>`;
            }
            return '';
        }).join('')}
      </div>
    `;

        // Set default recipient based on action type
        const recipientSelect = document.getElementById('modalRecipientGroup');
        if (recipientSelect) {
            if (actionType === 'eligible_enrollment') recipientSelect.value = 'eligible';
            else if (actionType === 'ineligible_enrollment') recipientSelect.value = 'ineligible';
            else if (actionType === 'missing_requirements') recipientSelect.value = 'affected';
            else if (actionType === 'cor_reminder') recipientSelect.value = 'no_cor';
            else if (actionType === 'grade_concern') recipientSelect.value = 'failing_grades';
            else recipientSelect.value = 'all';
        }

        // Update preview
        updateMessagePreview();

        // Show modal
        document.getElementById('actionModal').classList.remove('hidden');
        lucide.createIcons();
    }

    function updateMessagePreview() {
        const template = ACTION_TEMPLATES[currentActionType];
        if (!template) return;

        // Collect form data
        const formData = {};
        template.fields.forEach(field => {
            if (field.type === 'checklist' || field.type === 'multichecklist') {
                const checked = {};
                const checkboxes = document.querySelectorAll(`input[id^="field_${field.name}_"]`);
                checkboxes.forEach(cb => {
                    const value = cb.getAttribute('data-value');
                    if (cb.checked && value) checked[value] = true;
                });
                formData[field.name] = checked;
            } else if (field.type === 'checkbox') {
                const el = document.getElementById(`field_${field.name}`);
                if (el) formData[field.name] = el.checked;
            } else {
                const el = document.getElementById(`field_${field.name}`);
                if (el) formData[field.name] = el.value;
            }
        });

        currentFormData = formData;
        const preview = document.getElementById('messagePreview');
        if (preview) preview.textContent = template.generateBody(formData);
    }

    function closeActionModal() {
        document.getElementById('actionModal').classList.add('hidden');
        currentActionType = null;
    }

    async function sendActionMessage() {
        if (!currentActionType) return;

        const subject = document.getElementById('modalSubject').value.trim();
        const body = document.getElementById('modalBody').value.trim() || ACTION_TEMPLATES[currentActionType].generateBody(currentFormData);
        const recipientGroup = document.getElementById('modalRecipientGroup').value;
        const specificId = document.getElementById('modalSpecificStudent')?.value;

        if (!subject || !body) {
            showCmsToast('Please enter subject and message body.', 'error');
            return;
        }

        let recipients = getRecipientsByFilter(recipientGroup, specificId, currentActionType);

        if (recipients.length === 0) {
            showCmsToast('No students match the selected criteria.', 'error');
            return;
        }

        const sendBtn = document.querySelector('#actionModal .bg-red-700');
        const originalHTML = sendBtn?.innerHTML;
        if (sendBtn) {
            sendBtn.innerHTML = '<span class="animate-spin">⏳</span> Sending...';
            sendBtn.disabled = true;
        }

        try {
            const res = await fetch(`${MESSAGING_API}/send/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': (typeof getCSRFToken === 'function' ? getCSRFToken() : document.querySelector('[name=csrfmiddlewaretoken]')?.value),
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    recipients: recipients.map(r => r.id),
                    subject: subject,
                    body: body,
                    type: currentActionType,
                    channel: 'inbox'
                })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                showCmsToast(`✅ Message sent to ${data.sent_count} student(s)!`, 'success');
                addToMessageHistory(subject, data.sent_count);
                closeActionModal();
            } else {
                showCmsToast(data.message || 'Failed to send messages.', 'error');
            }
        } catch (err) {
            console.error('Send error:', err);
            showCmsToast('Failed to send messages. Please try again.', 'error');
        } finally {
            if (sendBtn) {
                sendBtn.innerHTML = originalHTML;
                sendBtn.disabled = false;
            }
        }
    }

    function getRecipientsByFilter(filter, specificId, actionType) {
        if (filter === 'specific' && specificId) {
            return studentListData.filter(s => s.id == specificId);
        }

        return studentListData.filter(student => {
            const hasAllDocs = (student.documents_uploaded || 0) === (student.documents_required || 5);
            const hasNoFailingGrades = (student.failing_grades || 0) === 0;
            const hasCOR = student.cor_uploaded || false;
            const gwaPass = student.gwa == null || (student.gwa <= 2.0);
            const isEligible = hasAllDocs && hasNoFailingGrades && hasCOR && gwaPass;

            switch (filter) {
                case 'all':
                    return true;
                case 'eligible':
                    return isEligible;
                case 'ineligible':
                    return !isEligible;
                case 'pending':
                    return (student.pending_documents || 0) > 0;
                case 'affected':
                    if (actionType === 'missing_requirements') return (student.pending_documents || 0) > 0;
                    if (actionType === 'cor_reminder') return !hasCOR;
                    if (actionType === 'grade_concern') return (student.failing_grades || 0) > 0;
                    return true;
                case 'no_cor':
                    return !hasCOR;
                case 'failing_grades':
                    return (student.failing_grades || 0) > 0;
                default:
                    return true;
            }
        });
    }

    function toggleComposer() {
        const composer = document.getElementById('customComposer');
        const chevron = document.getElementById('composerChevron');
        if (composer.classList.contains('hidden')) {
            composer.classList.remove('hidden');
            chevron.style.transform = 'rotate(180deg)';
        } else {
            composer.classList.add('hidden');
            chevron.style.transform = 'rotate(0deg)';
        }
    }

    function sendCustomMessage() {
        void postCustomMessaging('inbox');
    }

    function sendCustomNotification() {
        void postCustomMessaging('notification');
    }

    async function postCustomMessaging(channel) {
        const recipientGroup = document.getElementById('msgRecipientGroup').value;
        const specificId = document.getElementById('specificStudentSelect')?.value;
        const subject = document.getElementById('msgSubject').value.trim();
        const body = document.getElementById('msgBody').value.trim();

        if (!subject || !body) {
            showCmsToast('Please enter subject and message body.', 'error');
            return;
        }

        const recipients = getRecipientsByFilter(recipientGroup, specificId, null);

        if (recipients.length === 0) {
            showCmsToast('No students match the selected criteria.', 'error');
            return;
        }

        try {
            const res = await fetch(`${MESSAGING_API}/send/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': (typeof getCSRFToken === 'function' ? getCSRFToken() : document.querySelector('[name=csrfmiddlewaretoken]')?.value),
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    recipients: recipients.map(r => r.id),
                    subject,
                    body,
                    type: 'custom',
                    channel
                })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                const label = channel === 'notification' ? 'Notification' : 'Message';
                showCmsToast(`✅ ${label} sent to ${data.sent_count} student(s)`, 'success');
                addToMessageHistory(subject, data.sent_count);
                document.getElementById('msgSubject').value = '';
                document.getElementById('msgBody').value = '';
            } else {
                showCmsToast(data.message || 'Failed to send.', 'error');
            }
        } catch (e) {
            console.error(e);
            showCmsToast('Failed to send. Please try again.', 'error');
        }
    }

    // Load student data
    async function loadStudentMessagingData() {
        try {
            const res = await fetch(`${MESSAGING_API}/students-with-status/`, {
                credentials: 'same-origin',
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await res.json();
            if (data.success && data.students) {
                studentListData = data.students;
                updateStats();
                populateSelects();
                return;
            }
        } catch (err) {
            console.log('Using demo data');
        }
        loadDemoData();
    }

    function loadDemoData() {
        studentListData = [
            { id: 1, full_name: 'Maria Santos', student_id: 'MIT-001', documents_uploaded: 5, documents_required: 5, failing_grades: 0, gwa: 1.75, cor_uploaded: true, pending_documents: 0 },
            { id: 2, full_name: 'Juan Dela Cruz', student_id: 'MIT-002', documents_uploaded: 3, documents_required: 5, failing_grades: 1, gwa: 2.25, cor_uploaded: false, pending_documents: 2 },
            { id: 3, full_name: 'Jose Rizal', student_id: 'MIT-003', documents_uploaded: 5, documents_required: 5, failing_grades: 0, gwa: 1.50, cor_uploaded: true, pending_documents: 0 },
            { id: 4, full_name: 'Andres Bonifacio', student_id: 'MIT-004', documents_uploaded: 4, documents_required: 5, failing_grades: 2, gwa: 2.50, cor_uploaded: false, pending_documents: 1 },
        ];
        updateStats();
        populateSelects();
    }

    function updateStats() {
        let eligible = 0, ineligible = 0, pendingReq = 0, noCor = 0;
        studentListData.forEach(s => {
            const hasAllDocs = (s.documents_uploaded || 0) === (s.documents_required || 5);
            const hasNoFailingGrades = (s.failing_grades || 0) === 0;
            const hasCOR = s.cor_uploaded || false;
            const gwaPass = s.gwa == null || (s.gwa <= 2.0);
            if (hasAllDocs && hasNoFailingGrades && hasCOR && gwaPass) eligible++;
            else ineligible++;
            if ((s.pending_documents || 0) > 0) pendingReq++;
            if (!hasCOR) noCor++;
        });
        document.getElementById('totalStudentCount').textContent = studentListData.length;
        document.getElementById('eligibleCount').textContent = eligible;
        document.getElementById('ineligibleCount').textContent = ineligible;
        document.getElementById('pendingReqCount').textContent = pendingReq;
        document.getElementById('noCorCount').textContent = noCor;
    }

    function populateSelects() {
        const selects = ['specificStudentSelect', 'modalSpecificStudent'];
        selects.forEach(selectId => {
            const select = document.getElementById(selectId);
            if (select) {
                select.innerHTML = '<option value="">-- Select student --</option>' +
                    studentListData.map(s => `<option value="${s.id}">${s.full_name} (${s.student_id})</option>`).join('');
            }
        });
    }

    function renderMessageHistory() {
        const historyList = document.getElementById('recentMessagesList');
        if (!historyList) return;
        if (!messageHistory.length) {
            historyList.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">No messages sent yet.</p>';
            return;
        }
        historyList.innerHTML = messageHistory.map(msg => `
          <div class="p-3 bg-gray-50 rounded-lg border border-gray-100">
            <p class="text-xs font-semibold text-gray-700">${escapeHtml(msg.subject)}</p>
            <p class="text-xs text-gray-400 mt-1">To ${msg.count} student(s) · ${msg.time}</p>
          </div>
        `).join('');
    }

    function addToMessageHistory(subject, count) {
        const time = new Date().toLocaleString();
        messageHistory.unshift({ subject, count, time });
        if (messageHistory.length > 10) messageHistory.pop();
        localStorage.setItem('adminMessageHistory', JSON.stringify(messageHistory));
        renderMessageHistory();
    }

    function showCmsToast(message, type = 'success') {
        const toast = document.getElementById('cmsToast');
        if (toast) {
            const text = toast.querySelector('#cmsToastText');
            if (text) text.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        } else {
            alert(message);
        }
    }

    // Handle recipient dropdown to show/hide specific student selector
    document.addEventListener('DOMContentLoaded', () => {
        const modalRecipient = document.getElementById('modalRecipientGroup');
        if (modalRecipient) {
            modalRecipient.addEventListener('change', function () {
                const specificDiv = document.getElementById('modalSpecificDiv');
                if (specificDiv) specificDiv.classList.toggle('hidden', this.value !== 'specific');
            });
        }

        const composerRecipient = document.getElementById('msgRecipientGroup');
        if (composerRecipient) {
            composerRecipient.addEventListener('change', function () {
                const specificDiv = document.getElementById('specificStudentDiv');
                if (specificDiv) specificDiv.classList.toggle('hidden', this.value !== 'specific');
            });
        }

        loadStudentMessagingData();
        messageHistory = JSON.parse(localStorage.getItem('adminMessageHistory') || '[]');
        renderMessageHistory();
    });

    // Expose functions globally
    window.openActionModal = openActionModal;
    window.closeActionModal = closeActionModal;
    window.updateMessagePreview = updateMessagePreview;
    window.sendActionMessage = sendActionMessage;
    window.toggleComposer = toggleComposer;
    window.sendCustomMessage = sendCustomMessage;
    window.sendCustomNotification = sendCustomNotification;
    window.initMessagingPage = loadStudentMessagingData;
</script>
