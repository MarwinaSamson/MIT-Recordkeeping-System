{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Educational Background - Graduate School Admission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#A02724",
              beige: "#F5F0EB",
              "brand-light": "#C4524F",
            },
            fontFamily: {
              heading: ["Merriweather", "serif"],
              body: ['"Source Sans 3"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Source Sans 3", sans-serif;
      }

      h1,
      h2,
      h3 {
        font-family: "Merriweather", serif;
      }
    </style>
  </head>

  <body class="bg-beige min-h-screen">
    <header class="text-center py-8">
      <h1 class="text-3xl md:text-4xl font-bold text-brand">Graduate School</h1>
      <p class="text-lg text-gray-500 mt-1">Admission Form</p>
    </header>
    <div class="max-w-4xl mx-auto px-4 mb-8">
      <div class="flex items-center justify-between" id="progressBar"></div>
    </div>
    <div class="max-w-3xl mx-auto px-4 pb-12">
      <div class="bg-white rounded-2xl shadow-xl p-6 md:p-10">
        <h2 class="text-2xl font-bold text-brand mb-6">
          Educational Background
        </h2>
        <form id="eduForm" method="post" class="space-y-5" novalidate>
          {% csrf_token %}
          <!-- Sections generated by JS -->
          <div id="sections"></div>
          <div class="flex justify-between pt-4">
            <a
              href="{% url 'personalDetails' %}"
              class="inline-flex items-center gap-2 px-8 py-3 rounded-lg border-2 border-brand text-brand font-semibold hover:bg-brand/5 active:scale-[0.98] transition"
              >← Back</a
            >
            <button
              type="submit"
              class="inline-flex items-center gap-2 px-8 py-3 rounded-lg bg-brand text-white font-semibold hover:opacity-90 active:scale-[0.98] transition shadow-md"
            >
              Next →
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="{% static 'students_app/js/educationalBackground.js' %}"></script>
  </body>
</html>
