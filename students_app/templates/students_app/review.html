{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review - Graduate School Admission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@300;400;500;600;700&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { brand: "#A02724", beige: "#F5F0EB" },
            fontFamily: {
              heading: ["Merriweather", "serif"],
              body: ['"Source Sans 3"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Source Sans 3", sans-serif;
      }

      h1,
      h2,
      h3 {
        font-family: "Merriweather", serif;
      }

      .review-section {
        transition: all 0.2s;
      }

      .review-section:hover {
        border-color: #a02724;
        box-shadow: 0 4px 6px -1px rgba(160, 39, 36, 0.1);
      }
    </style>
  </head>

  <body class="bg-beige min-h-screen">
    <header class="text-center py-8">
      <h1 class="text-3xl md:text-4xl font-bold text-brand">Graduate School</h1>
      <p class="text-lg text-gray-500 mt-1">Admission Form</p>
    </header>
    <div class="max-w-4xl mx-auto px-4 mb-8">
      <div class="flex items-center justify-between" id="progressBar"></div>
    </div>
    <div class="max-w-4xl mx-auto px-4 pb-12">
      <div class="bg-white rounded-2xl shadow-xl p-6 md:p-10">
        <h2 class="text-2xl font-bold text-brand mb-6">
          Review Your Application
        </h2>
        <div id="reviewContent" class="space-y-5"></div>

        <!-- Digital Signature Confirmation -->
        <div
          id="signatureConfirmation"
          class="border border-green-200 rounded-xl p-5 bg-green-50/50 mt-6 hidden"
        >
          <div class="flex items-center gap-3">
            <i class="fas fa-check-circle text-green-600 text-xl"></i>
            <div>
              <p class="font-semibold text-green-800">
                Privacy Notice Acknowledged
              </p>
              <p class="text-sm text-green-600" id="signatureDetails"></p>
            </div>
          </div>
        </div>

        <div class="flex justify-between pt-6">
          <a
            href="{% url 'privacyNotice' %}"
            class="inline-flex items-center gap-2 px-8 py-3 rounded-lg border-2 border-brand text-brand font-semibold hover:bg-brand/5 active:scale-[0.98] transition"
            >← Back</a
          >
          <button
            onclick="submitApplication()"
            class="inline-flex items-center gap-2 px-8 py-3 rounded-lg bg-brand text-white font-semibold hover:opacity-90 active:scale-[0.98] transition shadow-md"
          >
            Submit Application
          </button>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div
      id="modal"
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center space-y-4"
      >
        <div
          class="mx-auto w-16 h-16 rounded-full bg-green-100 flex items-center justify-center"
        >
          <svg
            class="w-10 h-10 text-green-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <h3
          class="text-xl font-bold text-brand"
          style="font-family: &quot;Merriweather&quot;, serif"
        >
          Application Submitted!
        </h3>
        <p class="text-gray-500">
          Your Graduate School Admission Form has been successfully submitted.
        </p>
        <button
          onclick="finishSubmission()"
          class="w-full px-8 py-3 rounded-lg bg-brand text-white font-semibold hover:opacity-90 transition shadow-md"
        >
          Done
        </button>
      </div>
    </div>

    <script>
      // ===== PROGRESS BAR =====
      const STEPS = [
        { label: "Personal Details", page: "/personalDetails/" },
        { label: "Educational Background", page: "/educationalBackground/" },
        { label: "Working Student", page: "/workingStudent/" },
        { label: "Documents Upload", page: "/documents/" },
        { label: "Privacy Notice", page: "/privacyNotice/" },
        { label: "Review", page: "/review/" },
      ];
      const CURRENT_STEP = 6;

      function renderProgress() {
        const bar = document.getElementById("progressBar");
        bar.innerHTML = STEPS.map((step, i) => {
          const n = i + 1;
          const done = n < CURRENT_STEP;
          const cur = n === CURRENT_STEP;
          let cc = "bg-gray-300 text-white";
          if (done) cc = "bg-green-500 text-white";
          if (cur) cc = "bg-brand text-white shadow-lg scale-110";
          const lc = cur ? "text-brand font-bold" : "text-gray-400";
          const conn =
            i < STEPS.length - 1
              ? `<div class="flex-1 h-1 mx-2 rounded ${n < CURRENT_STEP ? "bg-green-500" : "bg-gray-300"}"></div>`
              : "";
          return `<div class="flex items-center ${i < STEPS.length - 1 ? "flex-1" : ""}">
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all ${cc}">${done ? "✓" : n}</div>
                    <span class="text-xs mt-2 text-center hidden sm:block max-w-[80px] ${lc}">${step.label}</span>
                </div>
                ${conn}
            </div>`;
        }).join("");
      }
      renderProgress();

      // ===== LOAD ALL DATA =====
      const personal = JSON.parse(
        localStorage.getItem("personalDetails") || "{}",
      );
      const education = JSON.parse(
        localStorage.getItem("educationalBackground") || "{}",
      );
      const working = JSON.parse(
        localStorage.getItem("workingStudent") || "{}",
      );
      const documents = JSON.parse(localStorage.getItem("documents") || "{}");
      const privacyConsent = JSON.parse(
        localStorage.getItem("privacyConsent") || "null",
      );
      const privacySignature = JSON.parse(
        localStorage.getItem("privacySignature") || "null",
      );

      // ===== HELPER FUNCTIONS =====
      function formatValue(value, defaultValue = "—") {
        return value && value.trim
          ? value.trim() || defaultValue
          : value || defaultValue;
      }

      function getFullName() {
        return (
          [personal.first_name, personal.middle_name, personal.last_name]
            .filter(Boolean)
            .join(" ") || "Not provided"
        );
      }

      // ===== RENDER REVIEW =====
      const content = document.getElementById("reviewContent");

      function sectionHTML(title, editPage, items, icon = null) {
        const iconHtml = icon
          ? `<i class="fas ${icon} text-brand/60 mr-2"></i>`
          : "";
        const rows = items
          .filter(
            ([label, value]) =>
              value !== undefined && value !== null && value !== "—",
          )
          .map(
            ([label, value]) => `
                    <div class="border-b border-gray-100 pb-2 last:border-0">
                        <span class="text-xs text-gray-400 uppercase tracking-wider">${label}</span>
                        <p class="text-sm font-medium text-gray-800">${value}</p>
                    </div>
                `,
          )
          .join("");

        if (!rows) return ""; // Skip empty sections

        return `
                <div class="review-section border border-gray-200 rounded-xl p-5 space-y-3 bg-white hover:shadow-md transition-all">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-bold text-brand flex items-center" style="font-family:'Merriweather',serif">
                            ${iconHtml}${title}
                        </h3>
                        <a href="${editPage}" class="text-sm font-semibold text-brand hover:underline flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                            Edit
                        </a>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
                        ${rows}
                    </div>
                </div>`;
      }

      // ===== PERSONAL DETAILS SECTION =====
      const personalItems = [
        ["Full Name", getFullName()],
        ["Date of Birth", personal.dob],
        ["Age", personal.age],
        ["Gender", personal.gender],
        ["Civil Status", personal.civil_status],
        ["Place of Birth", personal.place_of_birth],
        [
          "Religion",
          personal.religion === "Other"
            ? personal.religion_other
            : personal.religion,
        ],
        [
          "Ethnicity",
          personal.ethnicity === "Other"
            ? personal.ethnicity_other
            : personal.ethnicity,
        ],
        [
          "Nationality",
          personal.nationality === "Other"
            ? personal.nationality_other
            : personal.nationality,
        ],
        [
          "Disability",
          personal.disability === "Other"
            ? personal.disability_other
            : personal.disability,
        ],
        ["Permanent Address", personal.permanent_address],
        [
          "Current Address",
          personal.current_address || personal.permanent_address,
        ],
        ["Contact Number", personal.contact_number],
        ["Email Address", personal.email],
        ["Name of Parent", personal.name_of_parent],
        ["Parent Relationship", personal.relationship],
        [
          "Parent Monthly Income",
          personal.parent_income ? `₱${personal.parent_income}` : null,
        ],
        ["Name of Spouse", personal.name_of_spouse],
        ["Spouse Contact", personal.spouse_contact_number],
        [
          "Spouse Monthly Income",
          personal.spouse_income ? `₱${personal.spouse_income}` : null,
        ],
      ];

      content.innerHTML += sectionHTML(
        "Personal Details",
        "/personalDetails/",
        personalItems,
        "fa-user",
      );

      // ===== EDUCATIONAL BACKGROUND SECTION =====
      const eduItems = [];
      const levels = [
        { key: "elementary", title: "Elementary" },
        { key: "secondary", title: "Secondary" },
        { key: "college", title: "College" },
        { key: "graduate", title: "Graduate Studies" },
      ];

      levels.forEach((level) => {
        const data = education[level.key];
        if (data && (data.schoolName || data.degree || data.yearCompleted)) {
          eduItems.push([`${level.title} - School`, data.schoolName]);
          eduItems.push([`${level.title} - Degree`, data.degree]);
          eduItems.push([`${level.title} - Year`, data.yearCompleted]);
        }
      });

      if (education.scholarship) {
        eduItems.push(["Scholarship/Awards", education.scholarship]);
      }

      content.innerHTML += sectionHTML(
        "Educational Background",
        "/educationalBackground/",
        eduItems,
        "fa-graduation-cap",
      );

      // ===== WORKING STUDENT SECTION =====
      if (working.isEmployed) {
        const employmentItems = [
          ["Position", working.position],
          [
            "Monthly Income",
            working.monthlyIncome ? `₱${working.monthlyIncome}` : null,
          ],
          [
            "Employment Status",
            working.employmentStatus === "Other"
              ? working.employmentStatusOther
              : working.employmentStatus,
          ],
          ["Employer Name", working.employerName],
          ["Employer Address", working.employerAddress],
          ["Employer Contact", working.employerContact],
          [
            "Employer Classification",
            working.employerClassification === "Other"
              ? working.employerClassificationOther
              : working.employerClassification,
          ],
        ];
        content.innerHTML += sectionHTML(
          "Employment Information",
          "/workingStudent/",
          employmentItems,
          "fa-briefcase",
        );
      }

      // ===== DOCUMENTS SECTION =====
      const documentItems = [
        ["Dean's Recommendation", documents.deansRec || "Not uploaded"],
        ["TOR", documents.tor || "Not uploaded"],
        ["Honorable Dismissal", documents.honorableDismissal || "Not uploaded"],
        ["PSA (live birth)", documents.psa || "Not uploaded"],
        ["GSAT", documents.gsat || "Not uploaded"],
      ];
      content.innerHTML += sectionHTML(
        "Uploaded Documents",
        "/documents/",
        documentItems,
        "fa-file-alt",
      );

      // ===== PRIVACY NOTICE SECTION =====
      if (privacyConsent || privacySignature) {
        const consentData = privacyConsent || privacySignature;
        const consentDate = consentData?.dateAgreed || consentData?.date;
        const formattedDate = consentDate
          ? new Date(consentDate).toLocaleString("en-PH", {
              year: "numeric",
              month: "long",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            })
          : null;

        const privacyItems = [
          ["Name", consentData?.name || getFullName()],
          ["Date & Time", formattedDate],
          ["Consent Status", "✓ Agreed to Privacy Notice"],
          ["IP Address", consentData?.ipAddress || "Collected upon submission"],
          [
            "Browser",
            consentData?.userAgent
              ? consentData.userAgent.split(" ").slice(0, 3).join(" ")
              : "—",
          ],
        ];
        content.innerHTML += sectionHTML(
          "Privacy Notice Consent",
          "#",
          privacyItems,
          "fa-shield-alt",
        );

        // Show signature confirmation
        const sigDiv = document.getElementById("signatureConfirmation");
        const sigDetails = document.getElementById("signatureDetails");
        if (sigDiv && sigDetails) {
          sigDiv.classList.remove("hidden");
          sigDetails.textContent = `Digitally signed by ${consentData?.name || getFullName()} on ${formattedDate || "the agreed date"}`;
        }
      }

      // ===== SUBMIT FUNCTION =====
      function submitApplication() {
        // Prepare all application data
        const applicationData = {
          personalDetails: personal,
          educationalBackground: education,
          workingStudent: working,
          documents: documents,
          privacyConsent: privacyConsent || privacySignature,
          submittedAt: new Date().toISOString(),
          fullName: getFullName(),
        };

        // Send to backend
        fetch("/api/submit-application/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: JSON.stringify(applicationData),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              // Show success modal
              document.getElementById("modal").classList.remove("hidden");
            } else {
              alert(
                "Error: " + (data.message || "Failed to submit application"),
              );
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Error submitting application: " + error);
          });
      }

      // Helper function to get CSRF token from cookies
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(
                cookie.substring(name.length + 1),
              );
              break;
            }
          }
        }
        return cookieValue;
      }

      function finishSubmission() {
        // Clear all localStorage data
        localStorage.removeItem("personalDetails");
        localStorage.removeItem("educationalBackground");
        localStorage.removeItem("workingStudent");
        localStorage.removeItem("documents");
        localStorage.removeItem("privacyAgreed");
        localStorage.removeItem("privacyConsent");
        localStorage.removeItem("privacySignature");
        localStorage.removeItem("submissionData");

        // Redirect to first page
        window.location.href = "/personalDetails/";
      }

      // Add confirmation before leaving if data exists
      window.addEventListener("beforeunload", function (e) {
        const hasData =
          localStorage.getItem("personalDetails") ||
          localStorage.getItem("educationalBackground") ||
          localStorage.getItem("workingStudent");

        if (hasData && !window.location.href.includes("/personalDetails/")) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
    </script>
  </body>
</html>
